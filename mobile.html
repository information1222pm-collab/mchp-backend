<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>MCHP Mobile Trading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #000;
            color: #0f0;
            overflow-x: hidden;
            font-size: 14px;
        }

        .container {
            max-width: 100vw;
            padding: 10px;
            padding-bottom: 80px;
        }

        .header {
            background: #111;
            padding: 15px;
            border-bottom: 2px solid #0f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            font-size: 12px;
            background: #222;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .btn {
            background: #0a0;
            color: #000;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            touch-action: manipulation;
        }

        .btn:active {
            background: #080;
        }

        .btn-danger {
            background: #f00;
            color: #fff;
        }

        .btn-danger:active {
            background: #c00;
        }

        .btn:disabled {
            background: #333;
            color: #666;
        }

        .card {
            background: #111;
            border: 1px solid #0f0;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        .card-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-btn {
            background: #0a0;
            color: #000;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .card-body {
            font-size: 13px;
        }

        .collapsible {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsible.open {
            max-height: 2000px;
        }

        .token-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .token-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            margin: 5px 0;
        }

        .token-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .token-symbol {
            font-weight: bold;
            font-size: 14px;
        }

        .token-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 3px;
        }

        .status-rejected {
            background: #f00;
            color: #fff;
        }

        .status-signal {
            background: #0f0;
            color: #000;
        }

        .token-details {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .metric {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #0f0;
        }

        .metric-label {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .log-container {
            max-height: 200px;
            overflow-y: auto;
            background: #000;
            border: 1px solid #0f0;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        .log-entry {
            margin: 2px 0;
            word-wrap: break-word;
        }

        .log-info { color: #0ff; }
        .log-success { color: #0f0; }
        .log-warning { color: #ff0; }
        .log-error { color: #f00; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            border-top: 2px solid #0f0;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #0f0;
            font-size: 12px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .nav-btn.active {
            background: #0a0;
            color: #000;
            border-radius: 4px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (min-width: 600px) {
            .metrics-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #0ff;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #0f0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 MCHP Mobile</h1>
        <div class="status-bar">
            <div class="status-item" id="walletStatus">❌ Not Connected</div>
            <div class="status-item" id="systemStatus">⏸️ STOPPED</div>
            <div class="status-item" id="balance">0.00 SOL</div>
        </div>
    </div>

    <div class="container">
        <!-- Dashboard Tab -->
        <div id="dashboardTab" class="tab-content active">
            <div class="card">
                <div class="card-header">📊 Live Metrics</div>
                <div class="metrics-grid">
                    <div class="metric">
                        <div class="metric-value" id="totalTrades">0</div>
                        <div class="metric-label">Trades</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="winRate">0%</div>
                        <div class="metric-label">Win Rate</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="pnl">$0.00</div>
                        <div class="metric-label">P&L</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="tokensScanned">0</div>
                        <div class="metric-label">Scanned</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    🎯 Active Positions (<span id="positionCount">0</span>)
                    <button class="toggle-btn" onclick="toggleSection('positions')">▼</button>
                </div>
                <div id="positions" class="collapsible">
                    <div id="positionsList">
                        <p style="color: #888; text-align: center; padding: 20px;">No active positions</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    🔍 Available Tokens (<span id="tokenCount">0</span>)
                    <button class="toggle-btn" onclick="toggleSection('tokens')">▼</button>
                </div>
                <div id="tokens" class="collapsible">
                    <div id="tokensList" class="token-list">
                        <p style="color: #888; text-align: center; padding: 20px;">No tokens scanned</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls Tab -->
        <div id="controlsTab" class="tab-content">
            <div class="card">
                <div class="card-header">🔌 Wallet</div>
                <div class="card-body">
                    <button class="btn" id="connectBtn" onclick="connectWallet()">Connect Phantom</button>
                    <button class="btn btn-danger" id="disconnectBtn" onclick="disconnectWallet()" style="display: none;">Disconnect</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">🧠 ML Model</div>
                <div class="card-body">
                    <button class="btn" id="loadModelBtn" onclick="loadModel()">Load Model</button>
                    <div id="modelStatus" style="margin-top: 10px; color: #888;">Not loaded</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">⚙️ Trading Controls</div>
                <div class="card-body">
                    <button class="btn" id="startBtn" onclick="startTrading()">🚀 START TRADING</button>
                    <button class="btn btn-danger" id="stopBtn" onclick="stopTrading()" style="display: none;">⏹️ STOP</button>
                </div>
            </div>
        </div>

        <!-- Logs Tab -->
        <div id="logsTab" class="tab-content">
            <div class="card">
                <div class="card-header">
                    📝 System Logs
                    <button class="toggle-btn" onclick="clearLogs()">Clear</button>
                </div>
                <div class="log-container" id="logContainer">
                    <div class="log-entry log-info">System ready...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('dashboard')">📊 Dashboard</button>
        <button class="nav-btn" onclick="switchTab('controls')">⚙️ Controls</button>
        <button class="nav-btn" onclick="switchTab('logs')">📝 Logs</button>
    </div>

    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>

    <script>
        // State
        const state = {
            wallet: null,
            publicKey: null,
            connected: false,
            model: null,
            modelLoaded: false,
            isRunning: false,
            scanInterval: null,
            availableTokens: [],
            positions: [],
            stats: {
                totalTrades: 0,
                wins: 0,
                pnl: 0,
                tokensScanned: 0
            }
        };

        // Backend URL
        const BACKEND_URL = 'https://mchp-backend.onrender.com';

        // UI Functions
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        function toggleSection(id) {
            const section = document.getElementById(id);
            section.classList.toggle('open');
        }

        function addLog(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;

            // Keep only last 100 logs
            while (container.children.length > 100) {
                container.removeChild(container.firstChild);
            }
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '<div class="log-entry log-info">Logs cleared</div>';
        }

        function updateUI() {
            // Update stats
            document.getElementById('totalTrades').textContent = state.stats.totalTrades;
            document.getElementById('winRate').textContent = 
                state.stats.totalTrades > 0 
                    ? Math.round((state.stats.wins / state.stats.totalTrades) * 100) + '%'
                    : '0%';
            document.getElementById('pnl').textContent = '$' + state.stats.pnl.toFixed(2);
            document.getElementById('tokensScanned').textContent = state.stats.tokensScanned;

            // Update token count
            document.getElementById('tokenCount').textContent = state.availableTokens.length;
            document.getElementById('positionCount').textContent = state.positions.length;

            // Update tokens list
            const tokensList = document.getElementById('tokensList');
            if (state.availableTokens.length === 0) {
                tokensList.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">No tokens scanned</p>';
            } else {
                tokensList.innerHTML = state.availableTokens.slice(0, 20).map(token => `
                    <div class="token-item">
                        <div class="token-header">
                            <span class="token-symbol">${token.symbol}</span>
                            <span class="token-status ${token.status.includes('REJECT') ? 'status-rejected' : 'status-signal'}">
                                ${token.status}
                            </span>
                        </div>
                        <div class="token-details">
                            💰 MC: $${(token.marketCap / 1000).toFixed(0)}K | 
                            💧 Liq: $${(token.liquidity / 1000).toFixed(0)}K
                        </div>
                    </div>
                `).join('');
            }
        }

        // Wallet Functions
        async function connectWallet() {
            try {
                addLog('Connecting to Phantom wallet...', 'info');
                
                if (!window.solana || !window.solana.isPhantom) {
                    addLog('Phantom wallet not found! Install from phantom.app', 'error');
                    alert('Please install Phantom wallet from phantom.app');
                    return;
                }

                const resp = await window.solana.connect();
                state.wallet = window.solana;
                state.publicKey = resp.publicKey.toString();
                state.connected = true;

                document.getElementById('walletStatus').textContent = '✅ ' + state.publicKey.slice(0, 8) + '...';
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'block';

                addLog('Wallet connected: ' + state.publicKey.slice(0, 8) + '...', 'success');
                
                updateBalance();
            } catch (err) {
                addLog('Failed to connect wallet: ' + err.message, 'error');
            }
        }

        async function disconnectWallet() {
            await window.solana.disconnect();
            state.connected = false;
            state.wallet = null;
            state.publicKey = null;

            document.getElementById('walletStatus').textContent = '❌ Not Connected';
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('disconnectBtn').style.display = 'none';
            document.getElementById('balance').textContent = '0.00 SOL';

            addLog('Wallet disconnected', 'info');
        }

        async function updateBalance() {
            if (!state.connected) return;

            try {
                const balance = await window.solana.request({
                    method: 'getBalance',
                    params: []
                });
                
                const sol = (balance / 1e9).toFixed(6);
                document.getElementById('balance').textContent = sol + ' SOL';
            } catch (err) {
                console.error('Balance update failed:', err);
            }
        }

        // Model Functions
        async function loadModel() {
            try {
                addLog('Loading ML model...', 'info');
                document.getElementById('loadModelBtn').disabled = true;
                document.getElementById('modelStatus').innerHTML = '<div class="spinner"></div>';

                // Create simple model
                state.model = tf.sequential({
                    layers: [
                        tf.layers.dense({ units: 64, activation: 'relu', inputShape: [26] }),
                        tf.layers.dropout({ rate: 0.3 }),
                        tf.layers.dense({ units: 32, activation: 'relu' }),
                        tf.layers.dense({ units: 3, activation: 'softmax' })
                    ]
                });

                state.model.compile({
                    optimizer: 'adam',
                    loss: 'categoricalCrossentropy',
                    metrics: ['accuracy']
                });

                state.modelLoaded = true;
                document.getElementById('modelStatus').innerHTML = '✅ Model loaded';
                document.getElementById('loadModelBtn').style.display = 'none';
                addLog('ML model loaded successfully', 'success');
            } catch (err) {
                document.getElementById('modelStatus').innerHTML = '❌ Failed to load';
                document.getElementById('loadModelBtn').disabled = false;
                addLog('Failed to load model: ' + err.message, 'error');
            }
        }

        // Trading Functions
        async function startTrading() {
            if (!state.connected) {
                alert('Please connect wallet first!');
                return;
            }
            if (!state.modelLoaded) {
                alert('Please load ML model first!');
                return;
            }

            state.isRunning = true;
            document.getElementById('systemStatus').textContent = '🟢 RUNNING';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';

            addLog('🚀 TRADING SYSTEM STARTED!', 'success');
            
            scanAndTrade();
            state.scanInterval = setInterval(scanAndTrade, 300000); // 5 min
        }

        function stopTrading() {
            state.isRunning = false;
            clearInterval(state.scanInterval);
            
            document.getElementById('systemStatus').textContent = '⏸️ STOPPED';
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';

            addLog('Trading system stopped', 'warning');
        }

        async function scanAndTrade() {
            try {
                addLog('🔍 Scanning for tokens...', 'info');
                
                const response = await fetch(`${BACKEND_URL}/api/coins`);
                const tokens = await response.json();

                addLog(`📊 Found ${tokens.length} tokens!`, 'success');
                state.stats.tokensScanned += tokens.length;

                state.availableTokens = tokens.map(t => ({
                    ...t,
                    status: 'SCANNING',
                    symbol: t.symbol || 'UNKNOWN'
                }));

                updateUI();

                // Simple analysis (just for demo on mobile)
                for (const token of tokens.slice(0, 10)) {
                    await analyzeToken(token);
                    await new Promise(r => setTimeout(r, 500));
                }

                addLog('✅ Scan complete!', 'success');
                updateUI();

            } catch (err) {
                addLog('❌ Scan error: ' + err.message, 'error');
            }
        }

        async function analyzeToken(token) {
            // Simplified analysis for mobile
            const features = Array(26).fill(0).map(() => Math.random());
            const tensor = tf.tensor2d([features]);
            const prediction = state.model.predict(tensor);
            const data = await prediction.data();
            
            const categories = ['dump', '2x', '10x'];
            const maxIdx = data.indexOf(Math.max(...data));
            const category = categories[maxIdx];
            const confidence = data[maxIdx];

            const availableToken = state.availableTokens.find(t => t.mint === token.mint);
            if (availableToken) {
                if (confidence < 0.7) {
                    availableToken.status = 'REJECTED ML';
                } else if (Math.random() > 0.9) {
                    availableToken.status = 'SIGNAL FOUND';
                    addLog(`🎯 SIGNAL: ${token.symbol} - ${category} (${(confidence * 100).toFixed(0)}%)`, 'success');
                } else {
                    availableToken.status = 'REJECTED MOMENTUM';
                }
                updateUI();
            }

            tensor.dispose();
            prediction.dispose();
        }

        // Auto-update balance
        setInterval(() => {
            if (state.connected) updateBalance();
        }, 30000);

        addLog('Mobile app ready! Connect wallet to start.', 'success');
    </script>
</body>
</html>
